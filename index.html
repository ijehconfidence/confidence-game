<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Naija Dash — Street Runner</title>
<style>
:root{--ink:#102033;--lime:#d8ff42;--cyan:#38e7ff}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#081426;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:white;touch-action:none}
#game{display:block;width:100vw;height:100dvh;background:#101f36}
#hud{position:fixed;inset:0 0 auto 0;padding:calc(10px + env(safe-area-inset-top)) 12px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;gap:8px}
.pill{background:#071525d9;border:1px solid #ffffff35;border-radius:14px;padding:8px 12px;box-shadow:0 5px 18px #0003;backdrop-filter:blur(6px);font-weight:800;text-shadow:0 2px 2px #0004}
.pill small{display:block;font-size:10px;letter-spacing:1.4px;color:#a9c6df;font-weight:800}
#score,#coins{font-size:19px}
#brand{font-size:14px;letter-spacing:1px;color:var(--lime)}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;background:linear-gradient(#07142555,#071425b8);z-index:5}
.card{width:min(440px,100%);padding:26px 22px 22px;border-radius:26px;background:linear-gradient(145deg,#173451f5,#0b192cf5);border:1px solid #ffffff38;box-shadow:0 24px 70px #0008;text-align:center}
.logo{font-size:clamp(32px,9vw,52px);font-weight:1000;line-height:.95;letter-spacing:-2px;color:var(--lime);text-shadow:0 4px 0 #658514;margin:2px 0 10px}
.tag{font-weight:700;color:#d8e9f7;margin:0 auto 18px;line-height:1.5}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:17px 0 20px}
.how div{padding:10px 5px;border-radius:14px;background:#ffffff0e;border:1px solid #ffffff18;font-size:11px;color:#d5e5f2}
.how b{display:block;font-size:21px;margin-bottom:4px}
button{border:0;font:inherit;font-weight:950;cursor:pointer;touch-action:manipulation}
#start{width:100%;padding:15px 20px;border-radius:15px;background:var(--lime);color:#13230b;font-size:17px;box-shadow:0 5px 0 #7d9c1c}
#start:active{transform:translateY(3px);box-shadow:0 2px 0 #7d9c1c}
.note{font-size:11px;color:#a8c4db;margin:14px 0 0}
#controls{position:fixed;inset:auto 0 calc(16px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:end;padding:0 16px;pointer-events:none;z-index:3}
.pad{display:flex;gap:9px;pointer-events:auto}
.ctrl{width:57px;height:57px;border-radius:18px;background:#071525bb;color:white;border:1px solid #ffffff55;font-size:24px;box-shadow:0 5px 0 #0005;backdrop-filter:blur(4px)}
.ctrl.jump{width:75px;background:#d8ff42;color:#14220b;font-size:12px;letter-spacing:.5px}
.ctrl:active{transform:translateY(3px);box-shadow:0 2px 0 #0005}
#hint{position:fixed;bottom:calc(88px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:11px;font-weight:800;letter-spacing:1px;color:#ffffffb5;pointer-events:none;z-index:2}
@media(min-width:700px){#controls{padding:0 30px}.ctrl{width:64px;height:64px}.ctrl.jump{width:90px}}
</style>
</head>
<body>
<canvas id="game" aria-label="Naija Dash endless runner game"></canvas>
<div id="hud">
  <div class="pill"><small>SCORE</small><span id="score">0</span></div>
  <div class="pill" id="brand">🇳🇬 NAIJA DASH</div>
  <div class="pill"><small>COINS</small><span id="coins">0</span></div>
</div>
<div id="hint">◀ ▶ CHANGE LANE · ▲ JUMP · SWIPE TO MOVE</div>
<div id="controls">
  <div class="pad"><button class="ctrl" id="left" aria-label="Move left">◀</button><button class="ctrl" id="right" aria-label="Move right">▶</button></div>
  <button class="ctrl jump" id="jump">JUMP ▲</button>
</div>
<div id="overlay">
 <div class="card">
  <div class="logo">NAIJA<br>DASH</div>
  <p class="tag">Race through a colourful Lagos street.<br>Dodge danfos, jump barriers and collect coins!</p>
  <div class="how">
   <div><b>↔️</b>Switch lanes</div><div><b>⬆️</b>Jump barriers</div><div><b>🪙</b>Collect coins</div>
  </div>
  <button id="start">▶ START RUN</button>
  <p class="note">Made for phone and computer · No download needed</p>
 </div>
</div>
<script>
(() => {
const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score'), coinsEl=document.getElementById('coins'), overlay=document.getElementById('overlay');
let W=0,H=0,dpr=1, running=false, last=0, time=0, distance=0, score=0, coins=0, speed=0.34, spawn=0, items=[], particles=[];
let lane=1, laneX=0, jumpY=0, jumpV=0, stumble=0, flash=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize); resize();
function road(){return {topY:H*.19,bottomY:H*1.03, topW:W*.22,bottomW:W*.94, cx:W*.5}}
function roadX(z){const r=road(), p=clamp(z,0,1);return r.cx+(laneAt=>laneAt)(0)}
function project(z,l){const r=road(),p=clamp(z,0,1), y=r.topY+(r.bottomY-r.topY)*p, width=r.topW+(r.bottomW-r.topW)*p, x=r.cx+(l-1)*width*.285;return {x,y,s:.22+p*1.3,width,p}}
function rounded(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}
function drawBackground(){
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#74d8f2');g.addColorStop(.47,'#f7c68b');g.addColorStop(1,'#ff9d65');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // sun
 ctx.fillStyle='#fff0a6';ctx.beginPath();ctx.arc(W*.78,H*.17,Math.min(W,H)*.055,0,Math.PI*2);ctx.fill();
 // skyline and Lagos-style buildings
 const base=H*.44;
 for(let i=0;i<17;i++){let bw=W/13, x=i*W/12-W*.04, bh=H*(.08+((i*37)%9)/100);ctx.fillStyle=['#526b82','#3d5971','#e5a16d','#527d88'][i%4];ctx.fillRect(x,base-bh,bw,bh);ctx.fillStyle='#ffe0a0';for(let yy=base-bh+9;yy<base-7;yy+=13)for(let xx=x+6;xx<x+bw-4;xx+=12)ctx.fillRect(xx,yy,4,5)}
 // road shoulders
 const r=road();ctx.fillStyle='#285b4c';ctx.beginPath();ctx.moveTo(W*.35,r.topY);ctx.lineTo(W*.03,H);ctx.lineTo(W*.97,H);ctx.lineTo(W*.65,r.topY);ctx.closePath();ctx.fill();
 ctx.fillStyle='#343c4b';ctx.beginPath();ctx.moveTo(r.cx-r.topW/2,r.topY);ctx.lineTo(r.cx-r.bottomW/2,r.bottomY);ctx.lineTo(r.cx+r.bottomW/2,r.bottomY);ctx.lineTo(r.cx+r.topW/2,r.topY);ctx.closePath();ctx.fill();
 // roadside stripes
 for(let side of [-1,1]){ctx.strokeStyle='#f4d96b';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(r.cx+side*r.topW*.52,r.topY);ctx.lineTo(r.cx+side*r.bottomW*.52,r.bottomY);ctx.stroke()}
 // dashed lane markings, animated
 for(let l of [-.5,.5]){for(let i=0;i<9;i++){let z=((i/9+time*.00023)%1), p=z*z;let a=project(p,1);let x=a.x+l*a.width*.285;let y=a.y;let h=3+p*24;ctx.strokeStyle='#f7f4dfcc';ctx.lineWidth=1+p*4;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+h);ctx.stroke()}}
 // roadside palms/signs
 for(let i=0;i<5;i++){let z=((i/5+time*.00017)%1),p=z*z;let y=H*.4+p*H*.56, scale=.15+p*.9;for(let side of [-1,1]){let x=W*.5+side*(W*.34+p*W*.18);ctx.strokeStyle='#5c3c2c';ctx.lineWidth=3*scale;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y-38*scale);ctx.stroke();ctx.strokeStyle='#226c4a';ctx.lineWidth=3*scale;for(let a=-2;a<=2;a++){ctx.beginPath();ctx.moveTo(x,y-38*scale);ctx.lineTo(x+a*13*scale,y-43*scale-Math.abs(a)*2*scale);ctx.stroke()}}}
}
function drawRunner(x,y,s){
 // shadow
 ctx.fillStyle='#0004';ctx.beginPath();ctx.ellipse(x,y+4*s,18*s,6*s,0,0,Math.PI*2);ctx.fill();
 // legs animated
 let run=Math.sin(time*.018)*4*s;
 ctx.strokeStyle='#172338';ctx.lineWidth=7*s;ctx.lineCap='round';
 ctx.beginPath();ctx.moveTo(x-5*s,y-17*s);ctx.lineTo(x-7*s+run,y-3*s);ctx.lineTo(x-13*s+run,y+1*s);ctx.stroke();
 ctx.beginPath();ctx.moveTo(x+5*s,y-17*s);ctx.lineTo(x+8*s-run,y-5*s);ctx.lineTo(x+14*s-run,y-1*s);ctx.stroke();
 // shoes
 rounded(x-19*s+run,y-2*s,12*s,5*s,2*s,'#e9f1f6');rounded(x+5*s-run,y-3*s,13*s,5*s,2*s,'#e9f1f6');
 // arms
 ctx.strokeStyle='#8c4d2b';ctx.lineWidth=6*s;ctx.beginPath();ctx.moveTo(x-10*s,y-33*s);ctx.lineTo(x-17*s-run,y-22*s);ctx.stroke();ctx.beginPath();ctx.moveTo(x+10*s,y-33*s);ctx.lineTo(x+16*s+run,y-25*s);ctx.stroke();
 // body jersey
 rounded(x-12*s,y-39*s,24*s,25*s,6*s,'#18c5b7','#d8ff42');
 // jersey stripe
 ctx.fillStyle='#f5f6f3';ctx.fillRect(x-2*s,y-36*s,4*s,18*s);
 // neck/head
 ctx.fillStyle='#8c4d2b';ctx.fillRect(x-4*s,y-45*s,8*s,8*s);
 ctx.fillStyle='#8c4d2b';ctx.beginPath();ctx.arc(x,y-51*s,10*s,0,Math.PI*2);ctx.fill();
 // hair and headband
 ctx.fillStyle='#152333';ctx.beginPath();ctx.arc(x,y-55*s,9*s,Math.PI,Math.PI*2);ctx.fill();ctx.fillRect(x-9*s,y-55*s,18*s,4*s);
 ctx.fillStyle='#d8ff42';ctx.fillRect(x-9*s,y-53*s,18*s,2*s);
 // face
 ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x+3*s,y-51*s,1.4*s,0,Math.PI*2);ctx.fill();
}
function drawObstacle(it){
 const q=project(it.z,it.lane), x=q.x,y=q.y,s=q.s;
 if(it.type==='coin'){
  ctx.save();ctx.translate(x,y-20*s);ctx.scale(.78+Math.abs(Math.sin(time*.012))* .22,1);
  ctx.fillStyle='#8e5c0b';ctx.beginPath();ctx.ellipse(0,0,10*s+2,13*s+2,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ffd735';ctx.beginPath();ctx.ellipse(0,0,10*s,13*s,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#fff2a1';ctx.lineWidth=2*s;ctx.beginPath();ctx.ellipse(0,0,5*s,8*s,0,0,Math.PI*2);ctx.stroke();
  ctx.restore();return;
 }
 if(it.type==='barrier'){
  rounded(x-25*s,y-24*s,50*s,24*s,4*s,'#f3b332','#743e21');
  ctx.strokeStyle='#fff0c5';ctx.lineWidth=4*s;for(let k=-1;k<=1;k++){ctx.beginPath();ctx.moveTo(x+k*14*s,y-23*s);ctx.lineTo(x+(k*14+10)*s,y-1*s);ctx.stroke()}
  ctx.fillStyle='#5b392b';ctx.fillRect(x-29*s,y-4*s,58*s,5*s);
 }else{
  // colourful oncoming danfo mini-bus
  rounded(x-25*s,y-48*s,50*s,47*s,8*s,'#ffcb26','#7d431b');
  rounded(x-19*s,y-41*s,38*s,16*s,3*s,'#5fd7f0','#fff0a8');
  ctx.fillStyle='#243849';ctx.fillRect(x-15*s,y-37*s,10*s,10*s);ctx.fillRect(x+3*s,y-37*s,10*s,10*s);
  ctx.fillStyle='#e94735';ctx.fillRect(x-21*s,y-20*s,42*s,5*s);
  ctx.fillStyle='#172334';ctx.beginPath();ctx.arc(x-15*s,y-1*s,6*s,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(x+15*s,y-1*s,6*s,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.font=`bold ${Math.max(5,8*s)}px system-ui`;ctx.textAlign='center';ctx.fillText('LAGOS',x,y-10*s);
 }
}
function spawnItem(){let lanePick=Math.floor(Math.random()*3),type=Math.random()<.42?'coin':Math.random()<.55?'barrier':'bus';items.push({lane:lanePick,z:0,type,hit:false});if(type!=='coin'&&Math.random()<.5){for(let j=1;j<=3;j++)items.push({lane:(lanePick+j)%3,z:-j*.09,type:'coin',hit:false})}}
function reset(){lane=1;laneX=1;jumpY=0;jumpV=0;stumble=0;time=0;distance=0;score=0;coins=0;speed=.34;spawn=0;items=[];particles=[];scoreEl.textContent='0';coinsEl.textContent='0'}
function move(d){if(!running)return;lane=clamp(lane+d,0,2)}
function jump(){if(running&&jumpY===0){jumpV=13.5}}
document.getElementById('left').addEventListener('pointerdown',e=>{e.preventDefault();move(-1)});
document.getElementById('right').addEventListener('pointerdown',e=>{e.preventDefault();move(1)});
document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});
document.getElementById('start').addEventListener('click',()=>{reset();running=true;overlay.style.display='none';last=performance.now();requestAnimationFrame(loop)});
addEventListener('keydown',e=>{if(['ArrowLeft','a','A'].includes(e.key))move(-1);if(['ArrowRight','d','D'].includes(e.key))move(1);if(['ArrowUp',' ','w','W'].includes(e.key))jump()});
let touchStart=null;canvas.addEventListener('touchstart',e=>{let t=e.changedTouches[0];touchStart={x:t.clientX,y:t.clientY}},{passive:true});canvas.addEventListener('touchend',e=>{if(!touchStart)return;let t=e.changedTouches[0],dx=t.clientX-touchStart.x,dy=t.clientY-touchStart.y;if(Math.abs(dx)>25){move(dx>0?1:-1)}else if(dy<-20){jump()}touchStart=null},{passive:true});
function gameOver(){running=false;overlay.style.display='flex';overlay.querySelector('.logo').innerHTML='RUN<br>OVER';overlay.querySelector('.tag').innerHTML=`You scored <b>${score}</b> points and collected <b>${coins}</b> coins.<br>Ready for another run?`;overlay.querySelector('.how').innerHTML='<div><b>🏆</b>Score '+score+'</div><div><b>🪙</b>Coins '+coins+'</div><div><b>⚡</b>Try again</div>';document.getElementById('start').textContent='↻ RUN AGAIN'}
function loop(now){if(!running)return;let dt=Math.min(34,now-last);last=now;time+=dt;distance+=dt*speed*.07;score=Math.floor(distance);speed=Math.min(.62,speed+dt*.000002);spawn-=dt;if(spawn<=0){spawnItem();spawn=950/speed*.34}
 laneX+=(lane-laneX)*Math.min(1,dt*.018);
 if(jumpY>0||jumpV>0){jumpY+=jumpV*dt*.06;jumpV-=.75*dt*.06;if(jumpY<=0){jumpY=0;jumpV=0}}
 drawBackground();
 // draw items far to near
 items.sort((a,b)=>a.z-b.z);
 for(let it of items){it.z+=dt*.00024*speed/.34;if(it.z>1.12)continue;drawObstacle(it)}
 const p=project(1,laneX);let runnerY=H*.84-jumpY*4.2;
 drawRunner(p.x,runnerY,Math.min(1.25,W/390));
 // collision at bottom; match lane and jumping
 for(let it of items){if(it.hit||it.z<.83||it.z>.99||it.lane!==lane)continue;
  if(it.type==='coin'){it.hit=true;coins++;coinsEl.textContent=coins;score+=25;for(let n=0;n<6;n++)particles.push({x:p.x,y:runnerY-25,vx:(Math.random()-.5)*3,vy:-Math.random()*3,life:25});}
  else if(jumpY>12&&it.type==='barrier'){continue}
  else{it.hit=true;flash=12;gameOver();break}
 }
 items=items.filter(it=>it.z<1.12&&!it.hit);
 if(flash>0){ctx.fillStyle=`rgba(255,40,60,${flash/30})`;ctx.fillRect(0,0,W,H);flash--}
 for(let q of particles){q.x+=q.vx;q.y+=q.vy;q.life--;ctx.fillStyle='#ffe45e';ctx.fillRect(q.x,q.y,4,4)}particles=particles.filter(q=>q.life>0);
 scoreEl.textContent=score;
 requestAnimationFrame(loop)
}
// initial scene preview
drawBackground();drawRunner(W*.5,H*.83,Math.min(1.25,W/390));
})();
</script>
</body>
</html>
