<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confidence Game</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #10152f;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

header {
  padding: 14px 8px;
  background: #202957;
}

h1 {
  margin: 4px;
  color: #ffd447;
  font-size: 28px;
}

header p {
  margin: 6px;
  font-size: 13px;
}

#stats {
  display: flex;
  justify-content: space-around;
  gap: 5px;
  padding: 12px 4px;
  font-weight: bold;
  flex-wrap: wrap;
}

.stat {
  background: #263363;
  border-radius: 10px;
  padding: 9px;
}

#game {
  width: 100%;
  max-width: 760px;
  height: auto;
  display: block;
  margin: auto;
  background: #82d8ff;
  border: 3px solid #ffd447;
  border-radius: 8px;
  touch-action: none;
}

#message {
  min-height: 32px;
  padding: 8px;
  color: #ffe47a;
  font-weight: bold;
}

.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  padding: 8px 6px 14px;
}

button {
  border: none;
  border-radius: 14px;
  padding: 15px 20px;
  min-width: 65px;
  min-height: 54px;
  background: #ffd447;
  color: #171a35;
  font-size: 19px;
  font-weight: bold;
  cursor: pointer;
  touch-action: manipulation;
}

button:active {
  transform: scale(.94);
}

#jump {
  background: #53e69b;
}

#start {
  background: #ff8b57;
}

footer {
  padding: 12px;
  color: #c4cbe8;
  font-size: 12px;
}
</style>
</head>

<header>

  <p>Run • Jump • Collect Coins • Become a Champion!</p>
</header>

<div id="stats">
  <div class="stat">🪙 Coins: <span id="coins">0</span></div>
  <div class="stat">❤️ Lives: <span id="lives">3</span></div>
  <div class="stat">🏆 Score: <span id="score">0</span></div>
</div>

<canvas id="game" width="760" height="430"></canvas>

<div id="message">Tap START GAME to begin your adventure!</div>

<div class="controls">
  <button id="left" aria-label="Move left">⬅️</button>
  <button id="jump">⬆️ JUMP</button>
  <button id="right" aria-label="Move right">➡️</button>
</div>

<button id="start">▶ START GAME</button>

<footer>
  Made for adventurers everywhere • Confidence Game
</footer>
