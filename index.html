<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confidence Game</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
            padding: 30px 15px;
        }

        .game {
            max-width: 400px;
            margin: 40px auto;
            padding: 30px 20px;
            background: #ffffff15;
            border-radius: 20px;
            box-shadow: 0 0 20px #0005;
        }

        h1 {
            color: #00ff99;
        }

        button {
            padding: 15px 30px;
            margin-top: 15px;
            background: #00cc88;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.95);
        }

        #score {
            font-size: 35px;
            color: #00ff99;
        }
    </style>
</head>

<body>

    <div class="game">
        <h1>🎮 Confidence Game</h1>

        <p>Welcome to my game website!</p>

        <p>Tap the button as many times as you can.</p>

        <h2>Your Score</h2>

        <div id="score">0</div>

        <button onclick="increaseScore()">
            TAP TO PLAY!
        </button>

        <br>

        <button onclick="resetScore()">
            Restart Game
        </button>

        <p>Created by Confidence ❤️</p>
    </div>

    <script>
        let score = 0;

        function increaseScore() {
            score++;
            document.getElementById("score").textContent = score;
        }

        function resetScore() {
            score = 0;
            document.getElementById("score").textContent = score;
        }
    </script>

</body>
</html>
